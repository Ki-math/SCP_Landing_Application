<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" font-family="'Yu Gothic','Meiryo',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box  { fill:#eaf2fb; stroke:#2b6cb0; stroke-width:1.6; }
    .act  { fill:#fdf1e2; stroke:#c05621; stroke-width:1.6; }
    .pl   { fill:#e8f5e9; stroke:#2f855a; stroke-width:1.6; }
    .t    { font-size:13px; fill:#1a202c; }
    .ts   { font-size:11px; fill:#4a5568; }
    .tt   { font-size:15px; font-weight:bold; fill:#1a202c; }
    .lane { font-size:12px; font-weight:bold; fill:#718096; }
    .wire { stroke:#333; stroke-width:1.5; fill:none; marker-end:url(#ar); }
  </style>

  <text x="575" y="24" text-anchor="middle" class="tt">制御方式2 (姿勢内ループ + アクチュエータ) の信号の流れ</text>

  <!-- 周期レーン背景 -->
  <rect x="20"  y="40" width="190" height="500" fill="#f0f4f8"/>
  <rect x="220" y="40" width="700" height="500" fill="#fbfbf3"/>
  <rect x="930" y="40" width="200" height="500" fill="#f2faf2"/>
  <text x="115" y="58" text-anchor="middle" class="lane">追従MPC (100 ms)</text>
  <text x="570" y="58" text-anchor="middle" class="lane">姿勢内ループ + アクチュエータ (10 ms)</text>
  <text x="1030" y="58" text-anchor="middle" class="lane">プラント (10 ms)</text>

  <!-- 状態フィードバック (上段) -->
  <path class="wire" d="M1115,230 L1135,230 L1135,72 L110,72 L110,220"/>
  <path class="wire" d="M237,72 L237,240 L290,240 L290,260"/>
  <text x="620" y="87" class="ts">状態 x (姿勢 q・角速度 ω は内ループへも)</text>

  <!-- MPC -->
  <rect x="40" y="220" width="150" height="130" class="box" rx="8"/>
  <text x="115" y="245" text-anchor="middle" class="t">追従MPC</text>
  <text x="115" y="261" text-anchor="middle" class="ts">(LTV追従QP, PIPG)</text>
  <text x="115" y="283" text-anchor="middle" class="ts">推力ベクトル u(1:3)</text>
  <text x="115" y="300" text-anchor="middle" class="ts">姿勢コマンド qCmd</text>
  <text x="115" y="317" text-anchor="middle" class="ts">舵面指令 u(4:7)</text>

  <!-- 上段: スロットル経路 -->
  <path class="wire" d="M190,245 L225,245 L225,120 L255,120"/>
  <text x="196" y="238" class="ts">|T|</text>
  <rect x="255" y="95" width="120" height="50" class="box" rx="4"/>
  <text x="315" y="115" text-anchor="middle" class="ts">鉛直速度FB</text>
  <text x="315" y="131" text-anchor="middle" class="ts">velFB / velFBi</text>
  <path class="wire" d="M375,120 L415,120"/>
  <text x="388" y="113" class="ts">Tc</text>
  <rect x="415" y="95" width="140" height="50" class="act" rx="4"/>
  <text x="485" y="115" text-anchor="middle" class="ts">スロットル 1次遅れ</text>
  <text x="485" y="131" text-anchor="middle" class="ts">tauThr = 0.10 s</text>
  <path class="wire" d="M555,120 L1000,120 L1000,200"/>
  <text x="640" y="113" class="ts">推力の大きさ Tm</text>

  <!-- 中段: 姿勢PD -> 加算 -> ジンバル角 -->
  <path class="wire" d="M190,285 L255,285"/>
  <text x="200" y="278" class="ts">qCmd</text>
  <rect x="255" y="260" width="115" height="50" class="box" rx="4"/>
  <text x="312" y="280" text-anchor="middle" class="ts">姿勢誤差</text>
  <text x="312" y="296" text-anchor="middle" class="ts">qe = q⁻¹⊗qCmd</text>
  <path class="wire" d="M370,285 L392,285"/>
  <rect x="392" y="260" width="165" height="50" class="box" rx="4"/>
  <text x="474" y="280" text-anchor="middle" class="ts">PD則 (Kp=wn², Kd=2ζwn)</text>
  <text x="474" y="296" text-anchor="middle" class="ts">aDes = wn²·e − 2ζwn·ω</text>
  <path class="wire" d="M557,285 L577,285"/>
  <rect x="577" y="260" width="120" height="50" class="box" rx="4"/>
  <text x="637" y="280" text-anchor="middle" class="ts">慣性/腕長換算</text>
  <text x="637" y="296" text-anchor="middle" class="ts">T₂c, T₃c = a·J/L</text>
  <path class="wire" d="M697,285 L716,285"/>
  <circle cx="730" cy="285" r="13" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="730" y="290" text-anchor="middle" class="t">+</text>
  <path class="wire" d="M743,285 L762,285"/>
  <rect x="762" y="260" width="130" height="50" class="box" rx="4"/>
  <text x="827" y="280" text-anchor="middle" class="ts">ジンバル角 (小角)</text>
  <text x="827" y="296" text-anchor="middle" class="ts">δ=ΣT/|Tc|, ±tvcMax</text>

  <!-- 横推力フィードフォワード -> 加算器の下から結線 -->
  <path class="wire" d="M190,320 L240,320 L240,370 L730,370 L730,300"/>
  <text x="250" y="363" class="ts">横推力FF u(2:3)·Fs（PD単独では大機動を再構成できず必須）</text>

  <!-- ジンバル角 -> TVC 2次系 -> プラント -->
  <path class="wire" d="M827,310 L827,400"/>
  <rect x="742" y="400" width="172" height="50" class="act" rx="4"/>
  <text x="828" y="420" text-anchor="middle" class="ts">TVC 2次系</text>
  <text x="828" y="436" text-anchor="middle" class="ts">fGim=6Hz, ζ=0.707 (±レート)</text>
  <path class="wire" d="M914,425 L985,425 L985,320"/>
  <text x="922" y="418" class="ts">δ₁, δ₂</text>

  <!-- 下段: 舵面 (MPC出力を直結) -->
  <path class="wire" d="M190,335 L215,335 L215,490 L392,490"/>
  <text x="224" y="462" class="ts">u(4:7) をそのまま直結</text>
  <text x="224" y="478" class="ts">(配分はBflapでMPC側処理済)</text>
  <rect x="392" y="465" width="165" height="50" class="act" rx="4"/>
  <text x="474" y="485" text-anchor="middle" class="ts">舵面 1次遅れ</text>
  <text x="474" y="501" text-anchor="middle" class="ts">tauFlap = 0.20 s (±レート)</text>
  <path class="wire" d="M557,490 L1035,490 L1035,320"/>
  <text x="650" y="483" class="ts">フィン/フラップ舵角</text>

  <!-- プラント -->
  <rect x="945" y="200" width="170" height="120" class="pl" rx="8"/>
  <text x="1030" y="228" text-anchor="middle" class="t">プラント</text>
  <text x="1030" y="248" text-anchor="middle" class="ts">6自由度 (RK4, 10 ms)</text>
  <text x="1030" y="266" text-anchor="middle" class="ts">推力 = Tm·[1; δ₁; δ₂]</text>
  <text x="1030" y="284" text-anchor="middle" class="ts">+ 外乱 (thrEff, 風)</text>
</svg>
