<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 610" font-family="'Segoe UI','Yu Gothic UI',sans-serif">
  <defs>
    <marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#185FA5"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BA7517"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker>
  </defs>
  <rect width="680" height="610" fill="white"/>

  <!-- 凡例 -->
  <g font-size="11.5" fill="#5F5E5A">
    <line x1="24" y1="18" x2="52" y2="18" stroke="#BA7517" stroke-width="2.5"/><text x="58" y="22">高度同期（参照の引き方）</text>
    <line x1="220" y1="18" x2="248" y2="18" stroke="#185FA5" stroke-width="2.5"/><text x="254" y="22">制御信号</text>
    <line x1="340" y1="18" x2="368" y2="18" stroke="#5F5E5A" stroke-width="2.5"/><text x="374" y="22">状態フィードバック</text>
  </g>

  <!-- 計画参照 -->
  <rect x="24" y="40" width="270" height="78" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="40" y="64" font-size="14" font-weight="600" fill="#2C2C2A">SCvx計画の解（オフライン）</text>
  <text x="40" y="84" font-size="12" fill="#854F0B">参照プロファイル x_ref, u_ref, v_ref</text>
  <text x="40" y="102" font-size="12" fill="#854F0B">高度逆引き表 h → t_ref</text>

  <!-- 点火ディスパッチ -->
  <rect x="24" y="168" width="270" height="96" rx="10" fill="#FAC775" stroke="#BA7517" stroke-width="2"/>
  <text x="40" y="194" font-size="14" font-weight="700" fill="#412402">点火ディスパッチ（10 ms）</text>
  <text x="40" y="214" font-size="12" fill="#633806">いまの高度 h → 参照時刻 t_ref を逆引き</text>
  <text x="40" y="232" font-size="12" fill="#633806">「その高度で取るべき状態・推力」を出す</text>
  <text x="40" y="252" font-size="11.5" font-style="italic" fill="#854F0B">時計の代わりに高度で参照を進める</text>
  <line x1="160" y1="118" x2="160" y2="166" stroke="#BA7517" stroke-width="2" marker-end="url(#mA)"/>

  <!-- 追従MPC -->
  <rect x="380" y="146" width="256" height="92" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <rect x="554" y="154" width="70" height="20" rx="10" fill="#185FA5"/><text x="564" y="168" font-size="11" fill="#fff">100 ms</text>
  <text x="396" y="172" font-size="14" font-weight="600" fill="#2C2C2A">追従MPC（LTV-QP）</text>
  <text x="396" y="192" font-size="12" fill="#0C447C">参照点まわりの偏差を最小化</text>
  <text x="396" y="210" font-size="12" fill="#0C447C">担当: 横位置・姿勢</text>
  <text x="396" y="228" font-size="12" fill="#0C447C">出力: T1, T2, T3, フィン</text>
  <!-- 参照点 (ラベルは箱の上の空きに) -->
  <text x="298" y="136" font-size="11.5" fill="#854F0B">参照点 x_ref(h), u_ref(h)</text>
  <line x1="294" y1="192" x2="378" y2="192" stroke="#BA7517" stroke-width="2" marker-end="url(#mA)"/>

  <!-- 鉛直速度FB (幅を絞り, 右側にT2,T3レーンを確保) -->
  <rect x="380" y="278" width="200" height="86" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <rect x="514" y="286" width="56" height="20" rx="10" fill="#185FA5"/><text x="525" y="300" font-size="11" fill="#fff">10 ms</text>
  <text x="396" y="304" font-size="14" font-weight="600" fill="#2C2C2A">鉛直速度FB</text>
  <text x="396" y="324" font-size="12" fill="#0C447C">ΔT = k·( v_ref(h) − v実 )</text>
  <text x="396" y="342" font-size="12" fill="#0C447C">T1 ← clip( T1_MPC + ΔT )  担当: 鉛直</text>
  <path d="M 294 236 C 330 250, 345 300, 378 314" fill="none" stroke="#BA7517" stroke-width="2" marker-end="url(#mA)"/>
  <text x="288" y="288" font-size="11.5" fill="#854F0B">v_ref(h)</text>
  <line x1="450" y1="238" x2="450" y2="276" stroke="#185FA5" stroke-width="2" marker-end="url(#mB)"/>
  <text x="458" y="262" font-size="11.5" fill="#185FA5">T1</text>

  <!-- 着陸コミット -->
  <rect x="380" y="392" width="256" height="66" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1.5"/>
  <rect x="556" y="400" width="68" height="20" rx="10" fill="#378ADD"/><text x="563" y="414" font-size="11" fill="#fff">h &lt; 60 m</text>
  <text x="396" y="418" font-size="14" font-weight="600" fill="#2C2C2A">着陸コミット</text>
  <text x="396" y="438" font-size="12" fill="#0C447C">T2,T3 → 姿勢レートダンピングに切替</text>
  <!-- T2,T3: FB箱の右外を通す -->
  <line x1="604" y1="238" x2="604" y2="390" stroke="#185FA5" stroke-width="2" marker-end="url(#mB)"/>
  <text x="612" y="318" font-size="11.5" fill="#185FA5">T2,T3</text>
  <line x1="450" y1="364" x2="450" y2="390" stroke="#185FA5" stroke-width="2" marker-end="url(#mB)"/>

  <!-- プラント -->
  <rect x="380" y="486" width="256" height="72" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/>
  <rect x="568" y="494" width="56" height="20" rx="10" fill="#5F5E5A"/><text x="579" y="508" font-size="11" fill="#fff">10 ms</text>
  <text x="396" y="512" font-size="14" font-weight="600" fill="#2C2C2A">プラント（6自由度 RK4）</text>
  <text x="396" y="532" font-size="12" fill="#444441">外乱: 推力効率・横風・初期オフセット</text>
  <line x1="450" y1="458" x2="450" y2="484" stroke="#185FA5" stroke-width="2.5" marker-end="url(#mB)"/>
  <text x="458" y="476" font-size="11.5" fill="#185FA5">u = [T1,T2,T3,フィン]</text>

  <!-- 状態フィードバック: 下段を通し, ラベルは水平表記 -->
  <path d="M 560 558 V 578 H 660 V 190 H 638" fill="none" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#mG)"/>
  <text x="380" y="597" font-size="11.5" fill="#5F5E5A">状態 x（姿勢・速度・角速度）→ MPCへ</text>

  <!-- 高度h: プラント左から専用レーン (注釈はレーンの右に配置し交差なし) -->
  <path d="M 378 540 H 140 V 266" fill="none" stroke="#BA7517" stroke-width="2.5" marker-end="url(#mA)"/>
  <text x="120" y="558" font-size="12.5" font-weight="600" fill="#854F0B">高度 h が「時計」の役割</text>
  <g font-size="11.5" fill="#5F5E5A">
    <text x="158" y="330">計画より速く/遅く落ちていても、</text>
    <text x="158" y="346">燃焼プロファイル上の正しい点を</text>
    <text x="158" y="362">追うので点火タイミング分散を吸収</text>
  </g>
</svg>
