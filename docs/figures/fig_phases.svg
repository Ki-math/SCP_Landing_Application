<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI','Yu Gothic UI',sans-serif" font-size="14">
  <rect width="900" height="560" fill="white"/>
  <defs>
    <!-- Starship シルエット (直立, 原点=機体中心): ノーズコーン + 前後フラップ -->
    <g id="ship" stroke="#455a64" stroke-width="1.5" stroke-linejoin="round">
      <!-- 前方フラップ (ノーズ脇) -->
      <path d="M -6 -17 L -11.5 -9 L -6 -7 Z" fill="#cfd8dc"/>
      <path d="M  6 -17 L  11.5 -9 L  6 -7 Z" fill="#cfd8dc"/>
      <!-- 後方フラップ (基部脇) -->
      <path d="M -6.5 7 L -13 16.5 L -6.5 18 Z" fill="#cfd8dc"/>
      <path d="M  6.5 7 L  13 16.5 L  6.5 18 Z" fill="#cfd8dc"/>
      <!-- 胴体 -->
      <rect x="-6.5" y="-16" width="13" height="34" rx="2" fill="#eceff1"/>
      <!-- ノーズコーン -->
      <path d="M -6.5 -16 C -6.5 -26, -3 -31, 0 -33.5 C 3 -31, 6.5 -26, 6.5 -16 Z" fill="#cfd8dc"/>
    </g>
    <!-- Falcon9 ブースタ (直立=エンジン下向き, 原点=機体中心): 平頭 + グリッドフィン -->
    <g id="booster" stroke="#455a64" stroke-width="1.5" stroke-linejoin="round">
      <rect x="-9.5" y="-20" width="4" height="9" rx="1" fill="#cfd8dc"/>
      <rect x="5.5"  y="-20" width="4" height="9" rx="1" fill="#cfd8dc"/>
      <rect x="-5.5" y="-22" width="11" height="42" rx="1.5" fill="#eceff1"/>
      <path d="M -5.5 20 L -3 25 H 3 L 5.5 20 Z" fill="#90a4ae"/>
    </g>
    <!-- 燃焼炎 -->
    <g id="flame3" stroke="none" fill="#ff9800">
      <path d="M -5 26 Q -4 33 -3 26 Z"/>
      <path d="M -1.5 26 Q 0 36 1.5 26 Z"/>
      <path d="M 3 26 Q 4 33 5 26 Z"/>
    </g>
    <g id="flame1" stroke="none" fill="#ff9800">
      <path d="M -2 26 Q 0 34 2 26 Z"/>
    </g>
  </defs>
  <text x="20" y="28" font-size="18" font-weight="bold">フェーズ構成と自由終端時間</text>

  <!-- ===== Starship ===== -->
  <g transform="translate(0,50)">
    <text x="30" y="0" font-weight="bold" fill="#1565c0">Starship (ベリーフロップ → フリップ着陸)</text>

    <!-- 姿勢ピクト (バーの上の専用帯. 中心回転で向きを表現) -->
    <use href="#ship" transform="translate(132,46) rotate(90)"/>
    <use href="#ship"   transform="translate(330,44) rotate(50)"/>
    <use href="#flame3" transform="translate(330,44) rotate(50) translate(0,-7)"/>
    <use href="#ship"   transform="translate(449,45) rotate(15)"/>
    <use href="#flame1" transform="translate(449,45) rotate(15) translate(0,-7)"/>
    <use href="#ship"   transform="translate(674,45)"/>
    <use href="#flame1" transform="translate(674,45) translate(0,-7)"/>
    <g font-size="12" fill="#455a64">
      <text x="76" y="30">腹ばい (空力減速)</text>
      <text x="296" y="14">フリップ</text>
      <text x="430" y="14">起き上がり</text>
      <text x="652" y="14">直立</text>
    </g>

    <!-- フェーズバー -->
    <g transform="translate(30,84)">
      <rect x="0"   y="0" width="240" height="46" fill="#e3f2fd" stroke="#1565c0"/>
      <rect x="240" y="0" width="120" height="46" fill="#bbdefb" stroke="#1565c0"/>
      <rect x="360" y="0" width="140" height="46" fill="#90caf9" stroke="#1565c0"/>
      <rect x="500" y="0" width="300" height="46" fill="#64b5f6" stroke="#1565c0"/>
      <text x="12"  y="19">1 ベリー降下</text><text x="12" y="38" font-size="12">エンジン0基 / θ≤179°</text>
      <text x="250" y="19">2 フリップ</text><text x="250" y="38" font-size="12">3基 / θ:100→30°</text>
      <text x="370" y="19">3 減速</text><text x="370" y="38" font-size="12">1基 / θ:30→10°</text>
      <text x="512" y="19">4 最終降下・接地</text><text x="512" y="38" font-size="12">1基 / θ≤10° / 厳制約(phaseTight)</text>
      <g stroke="#333">
        <line x1="0" y1="60" x2="800" y2="60" stroke-width="1"/>
        <line x1="0" y1="54" x2="0" y2="66"/><line x1="240" y1="54" x2="240" y2="66"/>
        <line x1="360" y1="54" x2="360" y2="66"/><line x1="500" y1="54" x2="500" y2="66"/>
        <line x1="800" y1="54" x2="800" y2="66"/>
      </g>
      <text x="100" y="84" font-size="13">σ₁ (自由)</text>
      <text x="288" y="84" font-size="13">σ₂</text>
      <text x="420" y="84" font-size="13">σ₃</text>
      <text x="640" y="84" font-size="13">σ₄</text>
    </g>
  </g>

  <!-- ===== Falcon9 ===== -->
  <g transform="translate(0,280)">
    <text x="30" y="0" font-weight="bold" fill="#c62828">Falcon 9 級 (テールファースト・ホバースラム)</text>
    <text x="30" y="22" font-size="12" fill="#455a64">240 m/s で落下. ホバー不能 (最低推力 &gt; 重量) のため点火タイミングが精度を決める → 閉ループは高度同期 refSync='alt' + 速度FB</text>

    <!-- 姿勢ピクト (テールファースト: 常時エンジン下向き) -->
    <g font-size="12" fill="#455a64">
      <text x="112" y="36">落下 (無推力)</text>
      <text x="298" y="36">3基燃焼</text>
      <text x="492" y="36">1基燃焼</text>
      <text x="672" y="36">脚展開・直立</text>
    </g>
    <use href="#booster" transform="translate(140,66)"/>
    <use href="#booster" transform="translate(320,66) rotate(8)"/>
    <use href="#flame3"  transform="translate(320,66) rotate(8)"/>
    <use href="#booster" transform="translate(510,66) rotate(4)"/>
    <use href="#flame1"  transform="translate(510,66) rotate(4)"/>
    <g transform="translate(710,66)">
      <line x1="-5" y1="14" x2="-12" y2="26" stroke="#455a64" stroke-width="2" stroke-linecap="round"/>
      <line x1="5"  y1="14" x2="12"  y2="26" stroke="#455a64" stroke-width="2" stroke-linecap="round"/>
      <use href="#booster"/>
      <use href="#flame1"/>
    </g>

    <g transform="translate(30,104)">
      <rect x="0"   y="0" width="220" height="46" fill="#ffebee" stroke="#c62828"/>
      <rect x="220" y="0" width="180" height="46" fill="#ffcdd2" stroke="#c62828"/>
      <rect x="400" y="0" width="220" height="46" fill="#ef9a9a" stroke="#c62828"/>
      <rect x="620" y="0" width="180" height="46" fill="#e57373" stroke="#c62828"/>
      <text x="12"  y="19">1 コースト (落下)</text><text x="12" y="38" font-size="12">0基 / グリッドフィンのみ / θ≤12°</text>
      <text x="230" y="19">2 3基点火 (制動)</text><text x="230" y="38" font-size="12">3基 / θ≤12°</text>
      <text x="410" y="19">3 1基 (減速継続)</text><text x="410" y="38" font-size="12">1基 / θ≤8°</text>
      <text x="630" y="19">4 精密着陸</text><text x="630" y="38" font-size="12">1基 / θ≤4° / 厳制約</text>
      <g stroke="#333">
        <line x1="0" y1="60" x2="800" y2="60" stroke-width="1"/>
        <line x1="0" y1="54" x2="0" y2="66"/><line x1="220" y1="54" x2="220" y2="66"/>
        <line x1="400" y1="54" x2="400" y2="66"/><line x1="620" y1="54" x2="620" y2="66"/>
        <line x1="800" y1="54" x2="800" y2="66"/>
      </g>
      <text x="95"  y="84" font-size="13">σ₁</text>
      <text x="300" y="84" font-size="13">σ₂</text>
      <text x="500" y="84" font-size="13">σ₃</text>
      <text x="700" y="84" font-size="13">σ₄</text>
    </g>
  </g>

  <g font-size="13" fill="#555">
    <text x="20" y="515">・ノード→フェーズ対応は prob.phase, 点火基数は prob.eng, 傾斜上限は prob.tiltN (いずれもノード配列, 編集可).</text>
    <text x="20" y="535">・各フェーズ時間 σᵢ は最適化変数 (自由終端時間). 範囲は prob.opt.sigMin / sigMax, 初期推定は prob.sig0.</text>
  </g>
</svg>
